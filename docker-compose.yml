# Profiles:
#   (none)     bot only — Telegram via long polling, no inbound ports needed
#   tls        + Caddy, which gets a real certificate automatically.
#              Required for Viber, and for linking OneDrive / Google Drive.
#   local-api  + a self-hosted Telegram Bot API server, lifting the bot-side
#              download limit from 20 MB to 2 GB.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Holds the database, temp files and rclone.conf. Create the latter with
      #   docker compose run --rm bot rclone --config /data/rclone.conf config
      - fotohu-data:/data
      # Shared with telegram-bot-api under the local-api profile.
      - tg-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [bot]
    environment:
      # Must match the host part of FOTOHU_PUBLIC_URL.
      FOTOHU_DOMAIN: ${FOTOHU_DOMAIN:?set FOTOHU_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?get one at https://my.telegram.org/apps}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?get one at https://my.telegram.org/apps}
      TELEGRAM_LOCAL: 1
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api

volumes:
  fotohu-data:
  tg-api-data:
  caddy-data:
  caddy-config:
