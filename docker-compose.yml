# Profiles:
#   (none)     bot only — Telegram via long polling, no inbound ports needed
#   tls        + Caddy, which gets a real certificate automatically.
#              Required for Viber, and for linking OneDrive / Google Drive.
#   local-api  + a self-hosted Telegram Bot API server, lifting the bot-side
#              download limit from 20 MB to 2 GB.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # telegram-bot-api drops to uid 101 and writes its spool 0750/0640, so
    # nothing outside that group can read what it downloaded. Joining the group
    # is what lets the bot copy a file straight off the shared volume instead of
    # fetching it a second time over HTTP. Inert without the local-api profile.
    group_add:
      - "101"
    volumes:
      # Holds the database, temp files and rclone.conf. Create the latter with
      #   docker compose run --rm bot rclone --config /data/rclone.conf config
      - fotohu-data:/data
      # Shared with telegram-bot-api under the local-api profile.
      - tg-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [bot]
    environment:
      # Must match the host part of FOTOHU_PUBLIC_URL. Set it in .env before
      # enabling this profile — Compose evaluates ${...} for every service in
      # the file, profile or not, so a hard ${VAR:?} here would break the
      # default `docker compose up` too.
      FOTOHU_DOMAIN: ${FOTOHU_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      # Get these at https://my.telegram.org/apps and set them in .env before
      # enabling this profile. Left as ${VAR:-} rather than ${VAR:?} so the
      # default `docker compose up` (which still parses this service) works.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api

  tg-api-gc:
    # telegram-bot-api never reclaims what it downloads, and the bot cannot do
    # it either: group membership buys it a read of the spool, not the write on
    # the directory that unlinking needs. So the sweeping is done as root.
    #
    # Depth is what makes the rule safe. The server's own databases sit at the
    # top of the volume and at <token>/td.binlog — depth 1 and 2 — while media
    # lands in <token>/documents, <token>/videos and their siblings at depth 3.
    # An hour is an eternity next to the seconds between getFile and the copy.
    image: alpine:3
    profiles: ["local-api"]
    restart: unless-stopped
    command: >
      sh -c 'while true; do
        find /var/lib/telegram-bot-api -mindepth 3 -type f ! -name "*.binlog" -mmin +60 -delete;
        sleep 900;
      done'
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api

volumes:
  fotohu-data:
  tg-api-data:
  caddy-data:
  caddy-config:
